name: Patched Node frontend qualification
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22.23.4'
      - run: node -e "const a=require('node:assert/strict'),z=require('node:zlib');a.equal(process.version,'v22.23.4');a.equal(z.brotliDecompressSync(z.brotliCompressSync(Buffer.from('security'))).toString(),'security')"
      - run: npm ci
      - run: npm ci --prefix frontend --ignore-scripts
      - run: npm run test:certificate-compatibility --prefix frontend
      - run: npm exec --prefix frontend -- tsc --project frontend/tsconfig.app.json --noEmit
      - run: npm run build --prefix frontend
